name: C++ CI

on:
  push:
  #   branches:
  #     # - main
  #   tags:
  #     - "v*"
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: cplus-app-${{ matrix.os }}
          path: |
            build/cplus_app
            build/Release/cplus_app.exe
          if-no-files-found: ignore

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: cmake --build build --config Release --target cplus_tests

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: test
    # if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package binary
        run: |
          mkdir -p dist
          cp build/cplus_app dist/cplus_app
          tar -czf cplus_app-${{ github.ref_name }}-linux.tar.gz -C dist cplus_app

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: cplus_app-${{ github.ref_name }}-linux.tar.gz
